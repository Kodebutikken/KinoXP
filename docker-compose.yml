services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kinoxp
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_64_MYSQL}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MYSQLROOT}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ghcr.io/kodebutikken/kinoxp-backend:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PROD_DATABASE_URL: jdbc:mysql://mysql:3306/kinoxp
      PROD_USERNAME: ${MYSQL_USER}
      PROD_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    expose:
      - "8080"

  frontend:
    image: ghcr.io/kodebutikken/kinoxp-frontend:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    expose:
      - "80"

volumes:
  mysql-data:
